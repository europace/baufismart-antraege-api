name: Pull Request on Branch Push
on:
  push:
    branches:
      - "publish/*"

permissions: {}

jobs:
  ensure-pinned:
    name: Ensure SHA-pinned actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: zgosalvez/github-actions-ensure-sha-pinned-actions@c4e71056006d29f90204b2d063be337109507d62 # v5.0.10
        with:
          allowlist: |
            europace/

  pull-request:
    needs: ensure-pinned
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BEV_CODE_COMMITTER_APP_ID }}
          private-key: ${{ secrets.BEV_CODE_COMMITTER_PRIVATE_KEY }}
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          LAST_VERSION=$(gh api repos/${{ github.repository }}/tags --jq '.[0].name | ltrimstr("v")')
          MAJOR=$(echo "$LAST_VERSION" | cut -d. -f1)
          MINOR=$(echo "$LAST_VERSION" | cut -d. -f2)
          NEXT_VERSION="$MAJOR.$((MINOR + 1))"
          gh pr create \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --base master \
            --title "Release $NEXT_VERSION - " \
            --body "> Describe the new feature or API change here."
